name: weekly releases to prefix
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package

    runs-on: ubuntu-latest

    permissions:
      contents: read # to access the private repository

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: setup pixi
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5

      - name: build package
        run: pixi run build-package

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: target/conda/noarch/healpix-compress*

  publish:
    needs: build
    name: Publish the package
    runs-on: ubuntu-latest

    environment:
      name: prefix
      url: https://prefix.dev/grid4earth
    permissions:
      id-token: write # allow uploads to prefix.dev/grid4earth

    steps:
      - name: download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist

      - name: setup pixi
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          run-install: false

      - name: publish
        run: |
          pixi upload prefix -c grid4earth dist/healpix-compress* --generate-attestation
