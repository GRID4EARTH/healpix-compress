name: Upload Python Package on PyPI

# Builds the sdist and wheel on every pull request labelled `release`, and
# publishes them on PyPI when a GitHub release is published (trusted
# publishing: the `pypi` environment of this repository must be registered as
# a trusted publisher of the `healpix-compress` project on pypi.org).
# The conda package on prefix.dev/grid4earth keeps its own workflow
# (private-channel-publish.yml).

on:
  release:
    types: [published]
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'GRID4EARTH/healpix-compress'
      && (
        github.event_name == 'release'
        || (
          github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'release')
        )
      )
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install publish dependencies
        run: python -m pip install build twine
      - name: Build package
        run: python -m build . -o dist
      - name: Check built artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python -m twine check --strict dist/*
          ls -l dist
          # a release must build from its tag: a setuptools-scm development or
          # local version (no tag on the commit, or a dirty tree) is refused
          if [ "$EVENT_NAME" = "release" ] && ls dist | grep -qE '(\.dev[0-9]+|\+)'; then
            echo "❌ INVALID VERSION NUMBER (not built from a release tag)"
            exit 1
          else
            echo "✅ Looks good"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: releases
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.event_name == 'release'

    environment:
      name: pypi
      url: https://pypi.org/p/healpix-compress
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: releases
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          packages-dir: dist/
