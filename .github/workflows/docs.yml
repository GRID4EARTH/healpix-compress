name: Docs

# Builds docs/ on every pull request and push to main (a Sphinx warning fails
# the build), and deploys the pages of main to GitHub Pages.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# one build per branch / pull request: a new push cancels the build of a pull
# request still running, never a deployment (see the `deploy` job)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # setuptools-scm reads the version from the tags
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install healpix-compress and the docs dependencies
        run: |
          python -m pip install -e ".[jpegxl,wavelets]" -r docs/requirements.txt
          python -m pip list
      - name: Build the docs
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Upload the pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    # only deploy on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # allow only one concurrent deployment, and don't cancel it
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # deploy the site to GitHub Pages
      id-token: write # verify that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
