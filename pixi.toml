[workspace]
channels = ["conda-forge"]
name = "healpix-compress"
platforms = ["linux-64"]
version = "2026.5.1"

[tasks]

[dependencies]
numpy = ">=2.4.2,<3"
scipy = ">=1.17.1,<2"
zarr = ">=3"
imagecodecs = "*"
pywavelets = "*"

[pypi-dependencies]
healpix-compress = { path = ".", editable = true }

[feature.py313.dependencies]
python = "3.13.*"

[feature.dev.dependencies]
ipython = "*"
black = "*"
ipdb = "*"
pyinstrument = "*"
healpix-geo = ">=0.0.11"
jupyterlab = ">=4.5.5,<5"
jupyter-resource-usage = ">=1.2.0,<2"
jupyterlab_code_formatter = ">=3.0.3,<4"
xdggs = ">=0.6.0,<0.7"
xarray = ">=2026.2.0,<2027"
isort = ">=8.0.1,<9"
cartopy = ">=0.25.0,<0.26"

[feature.dev.pypi-dependencies]
healpix-plot = { git = "https://github.com/GRID4EARTH/healpix-plot.git" }

[feature.tests.dependencies]
pytest = "*"
hypothesis = ">=6.151.9,<7"
pytest-asyncio = ">=1.3.0,<2"

[feature.tests.tasks]
tests = { cmd = "pytest", default-environment = "dev", cwd = "." }

[feature.packaging.dependencies]
gitpython = "*"
cytoolz = "*"
packaging = "*"
rattler-build = ">=0.62.2,<0.63"

[feature.packaging.tasks]
prepare-recipe = { cmd = "python ci/rattler-recipe/prepare_recipe.py", cwd = "." }

[feature.packaging.tasks.build-package]
cmd = "rattler-build build -c https://prefix.dev/conda-forge --output-dir target/conda --recipe ci/rattler-recipe/recipe.yaml"
depends-on = ["prepare-recipe"]
cwd = "."

[environments]
default = ["dev", "py313", "tests"]
packaging = { features = ["packaging"], no-default-feature = true }
