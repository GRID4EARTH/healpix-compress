[workspace]
authors = ["Justus Magin <keewis@posteo.de>"]
channels = ["conda-forge"]
name = "healpix-chunk-compression"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
numpy = ">=2.4.2,<3"
scipy = ">=1.17.1,<2"

[feature.py313.dependencies]
python = "3.13.*"

[feature.dev.dependencies]
ipython = "*"
black = "*"
ipdb = "*"
pyinstrument = "*"

[feature.tests.dependencies]
pytest = "*"

[environments]
default = ["dev", "py313", "tests"]
