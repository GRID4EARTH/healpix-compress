[workspace]
authors = ["Justus Magin <keewis@posteo.de>"]
channels = ["conda-forge"]
name = "healpix-chunk-compression"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
numpy = ">=2.4.2,<3"
scipy = ">=1.17.1,<2"
zarr = ">=3"

[pypi-dependencies]
healpix-chunk-compression = { path = ".", editable = true }

[feature.py313.dependencies]
python = "3.13.*"

[feature.dev.dependencies]
ipython = "*"
black = "*"
ipdb = "*"
pyinstrument = "*"
healpix-geo = ">=0.0.11,<0.0.12"
jupyterlab = ">=4.5.5,<5"
jupyter-resource-usage = ">=1.2.0,<2"
jupyterlab_code_formatter = ">=3.0.3,<4"
xdggs = ">=0.6.0,<0.7"
xarray = ">=2026.2.0,<2027"
isort = ">=8.0.1,<9"

[feature.tests.dependencies]
pytest = "*"
hypothesis = ">=6.151.9,<7"

[environments]
default = ["dev", "py313", "tests"]
