[package]
name = "hcc-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native kernels of the hcc-uint16-jxl-pyramid codec of healpix-compress"
publish = false

[lib]
name = "hcc_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
