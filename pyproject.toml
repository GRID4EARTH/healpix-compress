[project]
name = "healpix-compress"
description = "Zarr codecs for HEALPix-aligned chunks, including lossless and quantised Sentinel-2 serializers"
readme = "README.md"
requires-python = ">= 3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GRID4EARTH" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2",
  "scipy",
  "zarr>=3",
]
dynamic = ["version"]

[project.optional-dependencies]
# lossless JPEG XL for the Sentinel-2 chain (hcc-sentinel2, hcc-sentinel2-pyramid)
jpegxl = ["imagecodecs"]
# discrete wavelet transform for hcc-grad-dwt
wavelets = ["PyWavelets"]

[project.urls]
Repository = "https://github.com/GRID4EARTH/healpix-compress"
Issues = "https://github.com/GRID4EARTH/healpix-compress/issues"

[project.entry-points."zarr.codecs"]
hcc-dct = "hcc.codecs.dct:HccDctCodec"
hcc-grad-dct = "hcc.codecs.grad_dct:HccGradDctCodec"
hcc-grad-dwt = "hcc.codecs.grad_dwt:HccGradDwtCodec"
hcc-decompose = "hcc.codecs.decompose:HccDecomposeCodec"
hcc-sentinel2 = "hcc.codecs.sentinel2:HccSentinel2Codec"
hcc-sentinel2-pyramid = "hcc.codecs.sentinel2_pyramid:HccSentinel2PyramidCodec"

[build-system]
requires = ["setuptools>=64.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Python modules only: otherwise setuptools-scm adds every tracked file under
# hcc/ as package data, and a build without .git ships hcc/__init__.py alone
include-package-data = false

[tool.setuptools.packages.find]
# hcc.tests stays in the package: the conda recipe's test runs the installed tests
include = ["hcc*"]

[tool.setuptools_scm]
fallback_version = "9999"

[tool.ruff]
builtins = ["ellipsis"]
exclude = [
  ".git",
  ".eggs",
  "build",
  "dist",
  "__pycache__",
  "docs",
]
target-version = "py311"

extend-include = ["*.ipynb"]
line-length = 100

[tool.ruff.lint]
select = [
  "F",   # Pyflakes
  "E",   # Pycodestyle
  "I",   # isort
  "UP",  # Pyupgrade
  "TID", # tidy imports
]
ignore = [
  "E402", # E402: module level import not at top of file
  "E501", # E501: line too long - let black worry about that
  "E731", # E731: do not assign a lambda expression, use a def
]
fixable = ["I", "TID252"]
extend-safe-fixes = [
  "TID252", # absolute imports
]


[tool.ruff.lint.isort]
known-first-party = ["hcc"]
known-third-party = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
